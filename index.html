<body>

  <main class="hero">

    <ul class="links in" style="--d: 200ms">
      <li>
        <a class="pill" href="https://www.linkedin.com/in/oscarlu23/" target="_blank" rel="noopener">
          <span>LinkedIn</span>
          <i class="go" style="--r: -45deg" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i>
        </a>
      </li>
      <li>
        <a class="pill" href="assets/oscar-lu-resume.pdf" target="_blank" rel="noopener">

          <i class="go" style="--r: -45deg" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i>

      </li>
      <li>

  <!-- Photo album. To add one: drop the image in assets/album/ and copy a <figure>.
       4:5 portrait crops look best; captions stay to a place and a year. -->
  <section class="album" id="photos" aria-label="Photos">
    <div class="strip">
      <figure class="shot"><img src="assets/album/harvard.jpg" alt="Harvard" loading="lazy"><figcaption>Harvard · 2024</figcaption></figure>
      <figure class="shot"><img src="assets/album/church-farm.jpg" alt="Church Farm School" loading="lazy"><figcaption>Church Farm</figcaption></figure>
      <figure class="shot"><img src="assets/album/yosemite.jpg" alt="Yosemite" loading="lazy"><figcaption>Yosemite</figcaption></figure>
      <figure class="shot"><img src="assets/album/la.jpg" alt="Los Angeles" loading="lazy"><figcaption>Los Angeles</figcaption></figure>
    </div>
  </section>
