<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scene cut · Oscar Lu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,900;1,9..144,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #0e0d0b; --paper: #f2ede3; --accent: #ff4b2b; --muted: #9a9387; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--ink);
      color: var(--paper);
      font-family: "JetBrains Mono", monospace;
      text-align: center;
    }
    .slate { max-width: 560px; }
    .label { color: var(--accent); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { font-family: Fraunces, Georgia, serif; font-weight: 900; font-size: clamp(64px, 16vw, 160px); line-height: 0.9; margin: 16px 0; letter-spacing: -0.04em; }
    h1 span { display: inline-block; animation: drop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    h1 span:nth-child(2) { animation-delay: 0.12s; color: var(--accent); }
    h1 span:nth-child(3) { animation-delay: 0.24s; transform-origin: bottom left; }
    @keyframes drop { from { transform: translateY(-120vh) rotate(-20deg); } }
    h1 span:nth-child(3) { animation: drop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.24s both, tip 0.6s ease-in 1.3s forwards; }
    @keyframes tip { to { transform: rotate(18deg) translateY(6px); } }
    p { font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 22px; margin: 0 0 32px; }
    a { display: inline-block; margin: 0 6px 8px; padding: 12px 20px; border: 1.5px solid var(--paper); border-radius: 999px; color: var(--paper); text-decoration: none; }
    a.primary { background: var(--accent); border-color: var(--accent); color: var(--ink); }
    @media (prefers-reduced-motion: reduce) { h1 span { animation: none !important; } }
  </style>
</head>
<body>
  <main class="slate">
    <p class="label">SC. ?? · 404</p>
    <h1><span>4</span><span>0</span><span>4</span></h1>
    <p>This scene was cut in the edit.</p>
    <a class="primary" href="/v2/">Watch the story</a>
    <a href="/resume.html">Resume</a>
  </main>
</body>
</html>
