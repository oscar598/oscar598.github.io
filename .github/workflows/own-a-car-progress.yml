# Updates own-a-car/progress.json from Stripe every hour so the page's meter stays live.
# Inert until the STRIPE_SECRET_KEY secret and PAYMENT_LINK_ID variable are set
# (Settings → Secrets and variables → Actions). Scheduled runs only fire on the default branch.
name: own-a-car progress
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: ${{ vars.PAYMENT_LINK_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 own-a-car/tools/stripe_keys.py count
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PAYMENT_LINK_ID: ${{ vars.PAYMENT_LINK_ID }}
      - run: |
          git config user.name "own-a-car bot"
          git config user.email "actions@users.noreply.github.com"
          git add own-a-car/progress.json
          git diff --cached --quiet || (git commit -m "own-a-car: update key count" && git push)
